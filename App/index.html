<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover,maximum-scale=1">
<title>LineWalker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--md-primary:#6750A4;--md-on-primary:#FFF;--md-primary-container:#EADDFF;--md-on-primary-container:#21005D;--md-surface:#FFFBFE;--md-on-surface:#1C1B1F;--md-surface-variant:#E7E0EC;--md-on-surface-variant:#49454F;--md-outline:#79747E;--md-outline-variant:#CAC4D0;--md-background:#FFFBFE;--md-on-background:#1C1B1F;--md-chart-bg:#E7E0EC;--md-shadow:rgba(0,0,0,.08);--md-scrim:rgba(0,0,0,.4);--md-error:#B3261E;--md-error-container:#F9DEDC;--md-on-error-container:#410E0B;--md-tertiary:#7D5260}
.dark{--md-primary:#D0BCFF;--md-on-primary:#381E72;--md-primary-container:#4F378B;--md-on-primary-container:#EADDFF;--md-surface:#1C1B1F;--md-on-surface:#E6E1E5;--md-surface-variant:#49454F;--md-on-surface-variant:#CAC4D0;--md-outline:#938F99;--md-outline-variant:#49454F;--md-background:#1C1B1F;--md-on-background:#E6E1E5;--md-chart-bg:#2a2a3a;--md-shadow:rgba(0,0,0,.3);--md-scrim:rgba(0,0,0,.6);--md-error:#F2B8B5;--md-error-container:#8C1D18;--md-on-error-container:#F9DEDC;--md-tertiary:#EFB8C8}
.pure-black{--md-surface:#000;--md-surface-variant:#1a1a1a;--md-background:#000;--md-chart-bg:#111}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{font-family:'Google Sans','Noto Sans SC',sans-serif;background:var(--md-background);color:var(--md-on-background);min-height:100vh;min-height:100dvh;overflow-x:hidden}
input,textarea{user-select:text;-webkit-user-select:text}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-size:24px;line-height:1;text-transform:none;direction:ltr;font-variation-settings:'FILL'0,'wght'400,'GRAD'0,'opsz'24}
.ms-filled{font-variation-settings:'FILL'1}
.ms-14{font-size:14px}.ms-16{font-size:16px}.ms-18{font-size:18px}.ms-20{font-size:20px}.ms-28{font-size:28px}.ms-32{font-size:32px}
@keyframes pulse-shadow{0%,100%{box-shadow:0 0 0 0 var(--md-primary-container)}50%{box-shadow:0 0 0 10px transparent}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.nav{position:sticky;top:0;z-index:20;background:var(--md-surface);display:flex;align-items:center;padding:2px 6px;border-bottom:1px solid var(--md-outline-variant);height:44px}
.nav-left{flex:1;display:flex;align-items:center}.nav-center{display:flex;align-items:center;gap:2px}.nav-right{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.nav-title{font-size:16px;font-weight:500;padding:0 4px;letter-spacing:-.3px}
.nav-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--md-on-surface-variant);background:transparent;border:none}
.nav-icon:active{transform:scale(.92);background:var(--md-surface-variant)}
.nav-timer{font-size:20px;font-weight:500;font-family:monospace;background:linear-gradient(135deg,var(--md-primary),var(--md-tertiary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;padding:0 2px;cursor:pointer}
.nav-pause{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--md-on-surface-variant)}
.nav-pause .ms{font-size:28px}.nav-pause:active{transform:scale(.92)}.nav-pause.paused{color:var(--md-tertiary)}
.conn-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer}
.conn-badge.off{background:var(--md-error-container);color:var(--md-on-error-container)}
.conn-badge.on{background:var(--md-primary-container);color:var(--md-on-primary-container);animation:pulse-shadow 2s infinite}

.card{background:var(--md-surface);border-radius:24px;margin:6px 10px;overflow:hidden;box-shadow:0 1px 2px var(--md-shadow)}
.card-header{display:flex;align-items:center;padding:8px 14px 6px;gap:8px}
.card-icon{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--md-primary-container);color:var(--md-on-primary-container)}
.card-title{font-size:13px;font-weight:500;color:var(--md-on-surface)}
.card-body{padding:0 14px 10px;overflow:hidden;max-height:800px;transition:max-height .4s cubic-bezier(.2,0,0,1),padding .3s,opacity .3s}
.card-body.collapsed{max-height:0;padding-top:0;padding-bottom:0;opacity:0}

.switch{position:relative;width:44px;height:24px;border-radius:12px;cursor:pointer;transition:background .3s;border:none;outline:none;margin-left:auto;flex-shrink:0}
.switch.on{background:var(--md-primary)}.switch.off{background:var(--md-surface-variant)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .3s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on::after{left:23px}

.toggle-row{display:flex;align-items:center;padding:6px 0;gap:6px;cursor:pointer}
.toggle-row .toggle-icon{transition:transform .3s;margin-left:auto;color:var(--md-on-surface-variant);font-size:20px}
.toggle-row .toggle-icon.open{transform:rotate(180deg)}
.collapse-body{overflow:hidden;max-height:0;transition:max-height .4s,padding .3s}
.collapse-body.open{max-height:400px;padding-top:8px}

.chip{background:var(--md-primary-container);color:var(--md-on-primary-container);border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip:active{filter:brightness(.9)}
.chip.primary{background:var(--md-primary);color:var(--md-on-primary)}
.chip.tonal{background:var(--md-secondary-container,#E8DEF8);color:var(--md-on-secondary-container,#1D192B)}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.fab{width:46px;height:46px;border-radius:14px;background:var(--md-primary-container);color:var(--md-on-primary-container);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px var(--md-shadow);transition:transform .15s}
.fab:active{transform:scale(.96)}.fab-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.input-sm{border:none;border-bottom:2px solid var(--md-outline);color:var(--md-on-surface);padding:6px 4px;font-size:13px;outline:none;width:100%;background:var(--md-surface-variant);border-radius:4px 4px 0 0;text-align:center}
.input-sm:focus{border-bottom-color:var(--md-primary)}
.sensor-row{display:flex;gap:6px;justify-content:center;padding:3px 0;flex-wrap:wrap}
.sensor-dot{width:46px;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;background:var(--md-surface-variant);color:var(--md-on-surface-variant);border:2px solid transparent;transition:all .25s}
.sensor-dot.on{background:var(--md-primary-container);color:var(--md-on-primary-container);border-color:var(--md-primary);box-shadow:0 0 0 4px var(--md-primary-container);transform:scale(1.08)}
.sensor-dot .sl{font-size:8px;opacity:.7}
.log-scroll{max-height:160px;overflow-y:auto;font-size:10px;font-family:monospace;line-height:1.5;padding:4px 0}
.log-line{padding:1px 0;border-bottom:1px solid var(--md-outline-variant)}
.log-line.sharp{color:var(--md-tertiary)}.log-line.cross{color:var(--md-primary)}.log-line.finish{color:#0a8a3a;font-weight:700}.log-line.info{color:var(--md-on-surface-variant)}

.overlay{position:fixed;inset:0;z-index:50;background:var(--md-scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}
.dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--md-surface);border-radius:28px;padding:20px;width:calc(100%-40px);max-width:380px;max-height:80vh;overflow-y:auto;z-index:51;opacity:0;transition:opacity .25s;pointer-events:none}
.dialog.show{opacity:1;pointer-events:auto}
.device-list{max-height:200px;overflow-y:auto}
.device-item{display:flex;align-items:center;gap:8px;padding:12px 4px;cursor:pointer;border-radius:14px}
.device-item:active{background:var(--md-surface-variant)}
.device-item .dev-name{flex:1;font-size:13px;font-weight:500}
.device-item .dev-check{color:var(--md-primary);display:none}
.device-item.connected .dev-check{display:block}

.settings-panel{position:fixed;top:0;right:-360px;width:320px;max-width:80vw;height:100vh;height:100dvh;z-index:51;background:var(--md-surface);transition:right .35s cubic-bezier(.2,0,0,1);display:flex;flex-direction:column;box-shadow:-2px 0 24px var(--md-shadow);overflow:hidden}
.settings-panel.open{right:0}
.settings-header{display:flex;align-items:center;padding:10px;gap:8px;border-bottom:1px solid var(--md-outline-variant)}
.settings-body{flex:1;overflow-y:auto;padding:12px}
.settings-section{margin-bottom:16px}
.settings-section h3{font-size:13px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.settings-section .desc{font-size:11px;color:var(--md-on-surface-variant);margin-bottom:6px}
.color-grid{display:flex;gap:6px;flex-wrap:wrap}
.color-swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.2s}
.color-swatch.active{border-color:var(--md-on-surface)}
.chart-wrap{position:relative}
.chart-wrap canvas{width:100%;height:120px;border-radius:14px;background:var(--md-chart-bg);display:block}
.chart-legend{position:absolute;top:4px;left:8px;font-size:9px;font-family:monospace;line-height:1.4}
.chart-legend .le{color:#4fc3f7;background:rgba(79,195,247,.15);display:block;padding:0 3px;border-radius:3px}
.chart-legend .lc{color:#e94560;background:rgba(233,69,96,.15);display:block;padding:0 3px;border-radius:3px}

.fs-overlay{position:fixed;inset:0;z-index:55;background:#000;display:none;flex-direction:column}
.fs-overlay.show{display:flex}
.fs-overlay canvas{flex:1;width:100%;object-fit:contain}
.fs-btn{position:absolute;top:12px;z-index:56;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);color:#fff;border:none;cursor:pointer}
.fs-btn.r12{right:12px}.fs-btn.r58{right:58px}

.pause-indicator{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;opacity:0;transition:opacity .3s}
.pause-indicator.show{opacity:1}
.pause-indicator .pi-icon{font-size:56px;color:var(--md-primary);background:var(--md-surface);border-radius:50%;width:90px;height:90px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#333;color:#eee;padding:8px 20px;border-radius:20px;font-size:12px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media(orientation:landscape) and (max-height:500px),(min-width:700px){
  body{max-width:100%;overflow:hidden}
  #mainContent{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:4px 6px;height:calc(100vh - 44px);overflow:hidden}
  .card{margin:2px 0}
  .card-body.collapsed{max-height:0}
  .card-body{max-height:none;overflow-y:auto}
  .log-scroll{max-height:calc(100vh - 180px)}
  .chart-wrap canvas{height:100px}
  .sensor-dot{width:38px}
  .col-left{grid-column:1;grid-row:1}
  .col-mid{grid-column:2;grid-row:1;overflow-y:auto}
  .col-right{grid-column:3;grid-row:1;overflow-y:auto;display:flex;flex-direction:column}
  .dialog{max-height:85vh}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-left"><span class="nav-title">LW v3</span></div>
  <div class="nav-center">
    <span class="nav-timer" id="stopwatch" onclick="resetTimer()">00:00.0</span>
    <button class="nav-pause" id="btnPause" onclick="togglePause()"><span class="ms">play_arrow</span></button>
  </div>
  <div class="nav-right">
    <span id="connBadge" class="conn-badge off" onclick="openBtDialog()"><span class="ms" style="font-size:20px">bluetooth</span> 未连</span>
    <button class="nav-icon" onclick="openSettings()"><span class="ms">settings</span></button>
  </div>
</nav>

<div id="mainContent">
  <div class="card col-left" id="cardSensor">
    <div class="card-header"><div class="card-icon"><span class="ms">sensors</span></div><div class="card-title">传感器</div><button class="switch on" id="swSensor" onclick="toggleCard('sensor')"></button></div>
    <div class="card-body" id="bodySensor">
      <div class="sensor-row"><div class="sensor-dot" id="sL2"><span class="sl">L2</span>□</div><div class="sensor-dot" id="sL1"><span class="sl">L1</span>□</div><div class="sensor-dot" id="sR1"><span class="sl">R1</span>□</div><div class="sensor-dot" id="sR2"><span class="sl">R2</span>□</div></div>
      <div class="sensor-row" style="margin-top:3px"><div class="sensor-dot" id="sTL"><span class="sl">TL</span>□</div><div class="sensor-dot" id="sTR"><span class="sl">TR</span>□</div></div>
      <div style="text-align:center;font-size:11px;color:var(--md-on-surface-variant);margin-top:4px"><span id="errVal">E=---</span> <span id="corVal">C=---</span></div>
    </div>
  </div>

  <div class="card col-mid" id="cardPid">
    <div class="card-header"><div class="card-icon"><span class="ms">monitoring</span></div><div class="card-title">PID</div><button class="switch on" id="swPid" onclick="toggleCard('pid')"></button></div>
    <div class="card-body" id="bodyPid">
      <div class="chart-wrap"><div class="chart-legend"><span class="le">─ 误差</span><span class="lc">─ 修正</span></div><canvas id="chart"></canvas></div>
      <div style="display:flex;gap:4px;align-items:flex-end;margin-top:6px">
        <div style="flex:1"><div style="font-size:9px;text-align:center;color:var(--md-on-surface-variant)">Kp</div><input class="input-sm" type="number" id="pidKp" step="0.1" value="12.0" onchange="syncPID()"></div>
        <div style="flex:1"><div style="font-size:9px;text-align:center;color:var(--md-on-surface-variant)">Ki</div><input class="input-sm" type="number" id="pidKi" step="0.1" value="0.3" onchange="syncPID()"></div>
        <div style="flex:1"><div style="font-size:9px;text-align:center;color:var(--md-on-surface-variant)">Kd</div><input class="input-sm" type="number" id="pidKd" step="0.1" value="7.0" onchange="syncPID()"></div>
        <div style="flex:1"><div style="font-size:9px;text-align:center;color:var(--md-on-surface-variant)">SP</div><input class="input-sm" type="number" id="pidSp" step="1" value="45" min="20" max="99" onchange="syncPID()"></div>
      </div>
      <div class="chip-row" style="margin-top:6px">
        <button class="chip tonal" onclick="preset(1)" style="flex:1;justify-content:center">保守</button>
        <button class="chip tonal" onclick="preset(2)" style="flex:1;justify-content:center">默认</button>
        <button class="chip tonal" onclick="preset(3)" style="flex:1;justify-content:center">激进</button>
        <button class="chip primary" onclick="sendCmd('SAVE')"><span class="ms ms-16">save</span></button>
      </div>
    </div>
  </div>

  <div class="card col-left" id="cardMotion">
    <div class="card-header"><div class="card-icon"><span class="ms">sports_esports</span></div><div class="card-title">运动控制</div><button class="switch on" id="swMotion" onclick="toggleCard('motion')"></button></div>
    <div class="card-body" id="bodyMotion">
      <div class="chip-row"><button class="chip primary" onclick="sendRaw('G')" style="flex:1;justify-content:center"><span class="ms ms-16">track_changes</span> 循迹</button><button class="chip" onclick="sendRaw('H')" style="flex:1;justify-content:center"><span class="ms ms-16">construction</span> 避障</button></div>
      <div class="toggle-row" onclick="toggleDir(event)"><span style="font-size:12px;color:var(--md-on-surface-variant)">方向控制</span><span class="ms toggle-icon" id="dirIcon" style="font-size:20px">expand_more</span></div>
      <div class="collapse-body" id="dirBody">
        <div class="fab-row" style="margin-top:4px">
          <button class="fab" onclick="sendRaw('@')"><span class="ms ms-28">arrow_upward</span></button>
          <button class="fab" onclick="sendRaw('A')"><span class="ms ms-28">arrow_downward</span></button>
          <button class="fab" onclick="sendRaw('C')"><span class="ms ms-28">turn_left</span></button>
          <button class="fab" onclick="sendRaw('D')"><span class="ms ms-28">turn_right</span></button>
        </div>
        <div class="chip-row" style="margin-top:6px;justify-content:center">
          <button class="chip" onclick="sendRaw('E')"><span class="ms ms-16">rotate_right</span> 顺180°</button>
          <button class="chip" onclick="sendRaw('F')"><span class="ms ms-16">rotate_left</span> 逆180°</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card col-right" id="cardLog">
    <div class="card-header"><div class="card-icon"><span class="ms">receipt_long</span></div><div class="card-title">运行日志</div><button class="switch on" id="swLog" onclick="toggleCard('log')"></button></div>
    <div class="card-body" id="bodyLog">
      <div class="log-scroll" id="logArea"></div>
      <button class="chip" style="width:100%;margin-top:6px;justify-content:center" onclick="document.getElementById('logArea').innerHTML=''">清空</button>
    </div>
  </div>
</div>

<div class="overlay" id="btOverlay" onclick="closeBtDialog()"></div>
<div class="dialog" id="btDialog">
  <h3 style="font-size:16px;font-weight:400;margin-bottom:8px;display:flex;align-items:center;gap:6px"><span class="ms">bluetooth</span> 蓝牙设备</h3>
  <div class="chip-row" style="margin-bottom:8px">
    <button class="chip primary" onclick="scanDevices()"><span class="ms ms-16">search</span> 扫描</button>
    <button class="chip" onclick="showManualBt()"><span class="ms ms-16">edit</span> 手动</button>
  </div>
  <div class="device-list" id="deviceList"></div>
  <input class="input-sm" type="text" id="customDevName" placeholder="HC-05" style="margin-top:6px;display:none">
  <div class="chip-row" id="manualRow" style="margin-top:6px;display:none"><button class="chip primary" style="flex:1;justify-content:center" onclick="doConnect()">连接</button></div>
  <button class="chip" id="btnDisconnect" style="width:100%;margin-top:6px;display:none;background:var(--md-error-container);color:var(--md-on-error-container);justify-content:center" onclick="doDisconnect()"><span class="ms">link_off</span> 断开</button>
</div>

<div class="overlay" id="settingsOverlay" onclick="closeSettings()"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="settings-header"><span style="font-size:18px;flex:1;font-weight:500">设置</span><button class="nav-icon" onclick="closeSettings()"><span class="ms">close</span></button></div>
  <div class="settings-body">
    <div class="settings-section">
      <h3><span class="ms">dark_mode</span> 深色模式</h3>
      <div class="chip-row"><button class="chip tonal" id="themeAuto" onclick="setTheme('auto')">跟随系统</button><button class="chip" id="themeLight" onclick="setTheme('light')">浅色</button><button class="chip" id="themeDark" onclick="setTheme('dark')">深色</button></div>
    </div>
    <div class="settings-section">
      <h3><span class="ms">nights_stay</span> 纯黑模式</h3>
      <div class="desc">深色模式下界面底色纯黑</div>
      <button class="switch" id="swPureBlack" style="position:static;margin:0" onclick="togglePureBlack()"></button>
    </div>
    <div class="settings-section">
      <h3><span class="ms">palette</span> 主题色</h3>
      <div class="desc">浅色/深色自适应</div>
      <div class="color-grid"><div class="color-swatch" style="background:#6750A4" onclick="pickColor('#6750A4',this)"></div><div class="color-swatch" style="background:#0D6E6E" onclick="pickColor('#0D6E6E',this)"></div><div class="color-swatch" style="background:#B22248" onclick="pickColor('#B22248',this)"></div><div class="color-swatch" style="background:#E8612C" onclick="pickColor('#E8612C',this)"></div><div class="color-swatch" style="background:#1A6CD0" onclick="pickColor('#1A6CD0',this)"></div><div class="color-swatch" style="background:#6B5E00" onclick="pickColor('#6B5E00',this)"></div><div class="color-swatch" style="background:#386A20" onclick="pickColor('#386A20',this)"></div><div class="color-swatch" style="background:#7D5260" onclick="pickColor('#7D5260',this)"></div></div>
      <div class="desc" style="margin-top:10px">取色器</div>
      <input class="input-sm" type="color" id="customColor" value="#6750A4" onchange="pickColor(this.value,null)" style="height:40px;cursor:pointer">
      <button class="chip primary" style="width:100%;margin-top:8px;justify-content:center" onclick="getWallpaper()"><span class="ms ms-16">wallpaper</span> 从壁纸取色</button>
    </div>
  </div>
</div>

<div class="fs-overlay" id="fsOverlay">
  <canvas id="fsChart"></canvas>
  <button class="fs-btn r12" onclick="closeFullscreen()"><span class="ms">close</span></button>
  <button class="fs-btn r58" id="fsPauseBtn" onclick="toggleFsPause()"><span class="ms">pause</span></button>
</div>

<div class="pause-indicator" id="pauseOverlay"><div class="pi-icon ms">pause_circle</div></div>
<div class="toast" id="toast"></div>

<script>
let btConnected=false,connectedDevName='',paused=false,chartPaused=false,fsPaused=false,timerMs=0,pureBlack=false;
let timerInterval=null, cardsExpanded={sensor:true,pid:true,motion:true,log:true};
const isAndroid=(typeof BTBridge!=='undefined');
if(!isAndroid)log('浏览器模式','info');

function toggleCard(n){cardsExpanded[n]=!cardsExpanded[n];let b=document.getElementById('body'+n[0].toUpperCase()+n.slice(1)),s=document.getElementById('sw'+n[0].toUpperCase()+n.slice(1));if(cardsExpanded[n]){b.classList.remove('collapsed');s.classList.add('on');s.classList.remove('off')}else{b.classList.add('collapsed');s.classList.remove('on');s.classList.add('off')}}
function togglePureBlack(){pureBlack=!pureBlack;document.body.classList.toggle('pure-black',pureBlack);document.getElementById('swPureBlack').classList.toggle('on',pureBlack);document.getElementById('swPureBlack').classList.toggle('off',!pureBlack);localStorage.setItem('lw-pureblack',pureBlack?'1':'0')}

function sendRaw(ch){if(!btConnected){toast('请先连接蓝牙');return;}BTBridge.send(ch);vibrate(10)}
function sendCmd(cmd){if(!btConnected){toast('请先连接蓝牙');return;}BTBridge.send(cmd+'\r\n')}
function syncPID(){['KP','KI','KD','SP'].forEach(k=>{sendCmd(k+'='+document.getElementById('pid'+k.replace('KP','Kp').replace('KD','Kd')).value)})}
function preset(n){const p=[null,{kp:8,ki:0.1,kd:5,sp:30},{kp:12,ki:0.3,kd:7,sp:45},{kp:18,ki:0.1,kd:10,sp:60}][n];document.getElementById('pidKp').value=p.kp;document.getElementById('pidKi').value=p.ki;document.getElementById('pidKd').value=p.kd;document.getElementById('pidSp').value=p.sp;sendCmd('PR'+n)}
function vibrate(ms){if(navigator.vibrate)navigator.vibrate(ms)}

function openBtDialog(){document.getElementById('btOverlay').classList.add('open');document.getElementById('btDialog').classList.add('show');scanDevices()}
function closeBtDialog(){document.getElementById('btOverlay').classList.remove('open');document.getElementById('btDialog').classList.remove('show')}
function scanDevices(){if(!isAndroid){document.getElementById('deviceList').innerHTML='<div class="device-item" style="opacity:.7">请在APP中使用</div>';return}try{let j=JSON.parse(BTBridge.scan()),h='';if(j.length===0)h='<div class="device-item" style="opacity:.7">未找到设备<small>先配对HC-05</small></div>';else for(let d of j){let c=(d===connectedDevName);h+='<div class="device-item'+(c?' connected':'')+'" onclick="doConnect(\''+d+'\')"><span class="ms">bluetooth</span><span class="dev-name">'+d+'</span><span class="dev-check ms">check_circle</span></div>'}document.getElementById('deviceList').innerHTML=h}catch(e){document.getElementById('deviceList').innerHTML='<div class="device-item" style="color:var(--md-error)">扫描失败</div>'}}
function showManualBt(){document.getElementById('customDevName').style.display='block';document.getElementById('manualRow').style.display='flex'}
function doConnect(name){if(!name)name=document.getElementById('customDevName').value.trim();if(!name)return;connectedDevName=name;log('连接 '+name+'…','info');BTBridge.connect(name)}
function doDisconnect(){connectedDevName='';BTBridge.disconnect()}
window.onBtConnected=function(){btConnected=true;updateConnUI();closeBtDialog();log('蓝牙已连接','info');vibrate(50)}
window.onBtDisconnected=function(){btConnected=false;connectedDevName='';updateConnUI();log('蓝牙已断开','info')}
function updateConnUI(){let b=document.getElementById('connBadge'),d=document.getElementById('btnDisconnect');if(btConnected){b.className='conn-badge on';b.innerHTML='<span class="ms" style="font-size:20px">bluetooth_connected</span> 已连';d.style.display='flex'}else{b.className='conn-badge off';b.innerHTML='<span class="ms" style="font-size:20px">bluetooth</span> 未连';d.style.display='none'}}

function updateStopwatch(){let t=timerMs/1000;document.getElementById('stopwatch').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')+'.'+Math.floor((t%1)*10)}
function startTimer(){if(timerInterval)return;timerInterval=setInterval(function(){timerMs+=100;updateStopwatch()},100)}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
function resetTimer(){stopTimer();timerMs=0;updateStopwatch();updatePauseBtn()}
function updatePauseBtn(){let b=document.getElementById('btnPause');if(timerMs===0||paused){b.innerHTML='<span class="ms">play_arrow</span>';b.classList.add('paused')}else{b.innerHTML='<span class="ms">pause</span>';b.classList.remove('paused')}}
function togglePause(){paused=!paused;updatePauseBtn();if(paused){document.getElementById('pauseOverlay').classList.add('show');stopTimer()}else{document.getElementById('pauseOverlay').classList.remove('show');startTimer()}}

function toggleDir(e){if(e)e.stopPropagation();let b=document.getElementById('dirBody'),t=document.getElementById('dirIcon');b.classList.toggle('open');t.classList.toggle('open')}

window.onBtData=function(data){data=data.trim();if(!data)return;if(data.startsWith('S=')){let b=data.substring(2);if(b.length>=6)updateSensors(b);return}let em=data.match(/E=([+\-\d.]+),C=([+\-\d.]+)/);if(em){document.getElementById('errVal').textContent='E='+(+em[1]>=0?'+':'')+parseFloat(em[1]).toFixed(1);document.getElementById('corVal').textContent='C='+(+em[2]>=0?'+':'')+parseFloat(em[2]).toFixed(1);if(!paused&&!chartPaused)addChart(+em[1],+em[2]);return}let pm=data.match(/KP=(\d+\.?\d*),KI=(\d+\.?\d*),KD=(\d+\.?\d*),SP=(\d+)/);if(pm){document.getElementById('pidKp').value=pm[1];document.getElementById('pidKi').value=pm[2];document.getElementById('pidKd').value=pm[3];document.getElementById('pidSp').value=pm[4];return}if(data.startsWith('[')){let c='';if(data.includes('直角'))c='sharp';else if(data.includes('十字'))c='cross';else if(data.includes('终点'))c='finish';log(data,c);return}log(data,'info')};
function updateSensors(b){const ids=['sL2','sL1','sR1','sR2','sTL','sTR'];for(let i=0;i<6;i++){let e=document.getElementById(ids[i]);e.className='sensor-dot'+(b[i]==='1'?' on':'');e.innerHTML='<span class="sl">'+ids[i].slice(1)+'</span>'+(b[i]==='1'?'●':'□')}}
function log(msg,c){let ts=new Date().toISOString().slice(11,23);let a=document.getElementById('logArea'),d=document.createElement('div');d.className='log-line'+(c?' '+c:'');d.textContent='['+ts+'] '+msg;a.appendChild(d);a.scrollTop=a.scrollHeight;if(a.children.length>500)a.removeChild(a.firstChild)}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}

// Chart
const cv=document.getElementById('chart'),cx=cv.getContext('2d'),MAX=200;let eh=new Array(MAX).fill(0),ch=new Array(MAX).fill(0),ci=0,chartMs=0,Y_RANGE=5;
function drawChart(canvas,ctx,errH,corH,idx){let w=canvas.clientWidth||canvas.width,h=canvas.clientHeight||canvas.height,pixelRatio=window.devicePixelRatio||1;canvas.width=w*pixelRatio;canvas.height=h*pixelRatio;ctx.scale(pixelRatio,pixelRatio);let mid=h/2;ctx.clearRect(0,0,w,h);let gv=getComputedStyle(document.documentElement).getPropertyValue('--md-outline-variant').trim()||'#CAC4D0';ctx.strokeStyle=gv;ctx.lineWidth=1;for(let i=0;i<=4;i++){let val=Y_RANGE-i*Y_RANGE*2/4,y=mid-val/Y_RANGE*(mid-10);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}let s=mid/Y_RANGE;ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<errH.length;i++){let j=(idx+i)%errH.length,x=w*i/errH.length,y=mid-errH[j]*s;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();ctx.strokeStyle='#e94560';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<corH.length;i++){let j=(idx+i)%corH.length,x=w*i/corH.length,y=mid-corH[j]*s;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
function addChart(e,c){if(paused||chartPaused)return;eh[ci]=e;ch[ci]=c;ci=(ci+1)%MAX;chartMs+=50;if(ci%4===0)drawChart(cv,cx,eh,ch,ci)}
setInterval(function(){if(!paused&&!chartPaused)drawChart(cv,cx,eh,ch,ci)},300);
// 双击 → 全屏
cv.addEventListener('dblclick',openFullscreen);
let fsScale=1,fsPinchStart=0;
function openFullscreen(){document.getElementById('fsOverlay').classList.add('show');let fc=document.getElementById('fsChart');let fcx=fc.getContext('2d');drawChart(fc,fcx,eh,ch,ci);let drawFs=function(){if(!fsPaused)drawChart(fc,fcx,eh,ch,ci)};fsInterval=setInterval(drawFs,300);fsScale=1;fsPinchStart=0;setupFsPinch(fc)}
function closeFullscreen(){document.getElementById('fsOverlay').classList.remove('show');if(fsInterval)clearInterval(fsInterval)}let fsInterval=null;
function toggleFsPause(){fsPaused=!fsPaused;document.getElementById('fsPauseBtn').innerHTML='<span class="ms">'+(fsPaused?'play_arrow':'pause')+'</span>'}
function setupFsPinch(canvas){let startDist=0;canvas.addEventListener('touchstart',function(e){if(e.touches.length===2){startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}});canvas.addEventListener('touchmove',function(e){if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(startDist>0){fsScale*=(d/startDist);fsScale=Math.max(.5,Math.min(5,fsScale));startDist=d}}})}

// Theme
function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function lerp(a,b,t){return a+(b-a)*t}
function toneColor(r,g,b,tone){if(tone>=50){let f=(tone-50)/50;return'#'+[r,g,b].map(c=>Math.round(lerp(c,255,f)).toString(16).padStart(2,'0')).join('')}let f=(50-tone)/50;return'#'+[r,g,b].map(c=>Math.round(lerp(c,0,f)).toString(16).padStart(2,'0')).join('')}
function genTokens(h,isDark){let[r,g,b]=hexToRgb(h),tc=toneColor.bind(null,r,g,b);if(isDark)return{primary:tc(80),onPrimary:tc(20),primaryContainer:tc(30),onPrimaryContainer:tc(90),surface:tc(6),onSurface:tc(90),surfaceVariant:tc(28),onSurfaceVariant:tc(80),outline:tc(60),outlineVariant:tc(28),background:tc(6),onBackground:tc(90),shadow:'rgba(0,0,0,.3)',scrim:'rgba(0,0,0,.6)',chartBg:'#2a2a3a',error:'#F2B8B5',errorContainer:'#8C1D18',onErrorContainer:'#F9DEDC',tertiary:'#EFB8C8'};return{primary:tc(40),onPrimary:'#FFF',primaryContainer:tc(90),onPrimaryContainer:tc(10),surface:tc(98),onSurface:tc(10),surfaceVariant:tc(92),onSurfaceVariant:tc(30),outline:tc(50),outlineVariant:tc(80),background:tc(98),onBackground:tc(10),shadow:'rgba(0,0,0,.08)',scrim:'rgba(0,0,0,.4)',chartBg:'#E7E0EC',error:'#B3261E',errorContainer:'#F9DEDC',onErrorContainer:'#410E0B',tertiary:'#7D5260'}}
function applyTokens(o){Object.keys(o).forEach(k=>document.documentElement.style.setProperty('--md-'+k.replace(/([A-Z])/g,'-$1').toLowerCase(),o[k]))}
var currentPrimaryHex='#6750A4',currentThemeMode='auto';
function pickColor(h,el){currentPrimaryHex=h;if(el){document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));el.classList.add('active')}document.getElementById('customColor').value=h;localStorage.setItem('lw-primary',h);applyTokens(genTokens(h,document.body.classList.contains('dark')))}
function setTheme(mode){currentThemeMode=mode;let isDark=(mode==='auto')?window.matchMedia('(prefers-color-scheme:dark)').matches:(mode==='dark');document.body.classList.toggle('dark',isDark);applyTokens(genTokens(currentPrimaryHex,isDark));document.getElementById('themeAuto').className='chip tonal';document.getElementById('themeLight').className='chip';document.getElementById('themeDark').className='chip';document.getElementById('theme'+mode.charAt(0).toUpperCase()+mode.slice(1)).className='chip tonal';localStorage.setItem('lw-theme',mode)}
function openSettings(){document.getElementById('settingsOverlay').classList.add('open');document.getElementById('settingsPanel').classList.add('open')}
function closeSettings(){document.getElementById('settingsOverlay').classList.remove('open');document.getElementById('settingsPanel').classList.remove('open')}
document.getElementById('settingsOverlay').addEventListener('click',closeSettings);
function getWallpaper(){if(!isAndroid){toast('仅APP可用');return}BTBridge.getWallpaperColor();toast('提取中…')}
window.onWallpaperColor=function(h){pickColor(h,null);toast('已应用: '+h)}

document.addEventListener('DOMContentLoaded',function(){
  currentThemeMode=localStorage.getItem('lw-theme')||'auto';currentPrimaryHex=localStorage.getItem('lw-primary')||'#6750A4';pureBlack=localStorage.getItem('lw-pureblack')==='1';
  setTheme(currentThemeMode);document.body.classList.toggle('pure-black',pureBlack);
  document.getElementById('swPureBlack').classList.toggle('on',pureBlack);document.getElementById('swPureBlack').classList.toggle('off',!pureBlack);
  document.getElementById('customColor').value=currentPrimaryHex;
  document.querySelectorAll('.color-swatch').forEach(s=>{let bg=s.getAttribute('style')||'';s.classList.toggle('active',bg.indexOf(currentPrimaryHex)!==-1)});
  drawChart(cv,cx,eh,ch,ci);updateConnUI();
})
</script>
</body>
</html>
