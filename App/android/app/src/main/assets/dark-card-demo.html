<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深色模式卡片分隔方案对比</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#1C1B1F;color:#E6E1E5;padding:24px}

h2{font-size:16px;font-weight:500;margin:20px 0 12px;opacity:.7}

.row{display:flex;gap:16px;flex-wrap:wrap}
.swatch{width:48px;height:48px;border-radius:12px;flex-shrink:0}
.swatch.bg{background:#1C1B1F;border:1px dashed #49454F}
.swatch.surface{background:#25232A}
.swatch.primary{background:#D0BCFF}
.swatch.chip{background:#4F378B}
.swatch.variant{background:#49454F}

.label-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px;font-size:11px;opacity:.5}
.label-row span{width:48px;text-align:center;flex-shrink:0}

/* 方案0：无分隔（现状） */
.card-0{background:#25232A;border-radius:16px;padding:20px}
.card-0 .inner{display:flex;gap:8px}

/* 方案1：极细描边 */
.card-1{background:#25232A;border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,.08)}

/* 方案2：边框+微光 */
.card-2{background:#25232A;border-radius:16px;padding:20px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.3)}

/* 方案3：亮边框 */
.card-3{background:#25232A;border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,.14)}

/* 方案4：outline-variant 色边框 */
.card-4{background:#25232A;border-radius:16px;padding:20px;border:1px solid #49454F}

/* 方案5：顶部亮色细条 */
.card-5{background:#25232A;border-radius:16px;padding:20px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.card-5::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}

/* 方案6：双层阴影模拟高度 */
.card-6{background:#2B2930;border-radius:16px;padding:20px;box-shadow:0 2px 4px rgba(0,0,0,.4),0 8px 32px rgba(0,0,0,.25)}

/* 方案7：微亮底色+内边框 */
.card-7{background:#2C2A33;border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}

.section-title{font-size:13px;font-weight:600;margin-bottom:8px;opacity:.9}
.dot{width:10px;height:10px;border-radius:50%;background:#D0BCFF;display:inline-block;margin-right:4px}
</style>
</head>
<body>

<h2>图例</h2>
<div class="label-row"><span>背景</span><span>卡片</span><span>主题色</span><span>chip</span><span>浅灰</span></div>
<div class="row"><div class="swatch bg"></div><div class="swatch surface"></div><div class="swatch primary"></div><div class="swatch chip"></div><div class="swatch variant"></div></div>

<h2>方案0 — 无分隔（现状）</h2>
<div class="card-0"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<h2>方案1 — 极细白色边框 8%</h2>
<div class="card-1"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<h2>方案2 — box-shadow 模拟描边 + 阴影</h2>
<div class="card-2"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<h2>方案3 — 明显白色边框 14%</h2>
<div class="card-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<h2>方案4 — outline-variant 色边框</h2>
<div class="card-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<h2>方案5 — 顶部渐变亮线装饰</h2>
<div class="card-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<h2>方案6 — 双层阴影抬高卡片</h2>
<div class="card-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<h2>方案7 — 微亮底色+内阴影+外边框</h2>
<div class="card-7"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

</body>
</html>
